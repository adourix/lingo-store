services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lingo
      POSTGRES_PASSWORD: lingo
      POSTGRES_DB: lingo_store
    ports:
      - "5432:5432"
    volumes:
      - lingo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingo -d lingo_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lingo_postgres:
