name: finalize source cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[source-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and repair the checked-out source
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify the repaired source
        run: pnpm typecheck

      - name: Remove the temporary source repair hook
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          delete pkg.scripts.postinstall;
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm scripts/repair-api-syntax.mjs
          pnpm exec prettier --write apps/api/src/server.ts package.json

      - name: Commit cleaned source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/server.ts package.json scripts/repair-api-syntax.mjs
          if git diff --cached --quiet; then
            echo 'No cleanup changes were necessary.'
            exit 0
          fi
          git commit -m 'chore: commit repaired API source [source-cleanup]'
          git push origin main

      # one-time cleanup trigger
