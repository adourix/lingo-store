name: final format

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[final-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/api/src/server.ts \
            apps/api/src/tests/pos-auth-contract.test.ts \
            apps/pos/package.json \
            apps/pos/next.config.ts \
            apps/pos/app/layout.tsx \
            apps/pos/app/LocaleToggle.tsx \
            apps/pos/middleware.ts \
            docs/adr/002-web-pos-companion.md \
            package.json \
            scripts/api-test-ci.mjs \
            .github/workflows/security.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/server.ts apps/api/src/tests/pos-auth-contract.test.ts apps/pos/package.json apps/pos/next.config.ts apps/pos/app/layout.tsx apps/pos/app/LocaleToggle.tsx apps/pos/middleware.ts docs/adr/002-web-pos-companion.md package.json scripts/api-test-ci.mjs .github/workflows/security.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: finalize repository formatting [final-format]'
          git push origin main
