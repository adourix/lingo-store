name: security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @lingo/api test
      - run: pnpm format:check
      - name: Dependency audit
        run: pnpm audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Secret scan
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --report-format=json --report-path=/repo/gitleaks-report.json --no-banner
          status=$?
          cat gitleaks-report.json || true
          rm -f gitleaks-report.json
          exit $status
  codeql:
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
