name: security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
  security-events: write
  actions: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: pnpm install --lockfile-only
      - run: pnpm install --no-frozen-lockfile
      - run: git add pnpm-lock.yaml && git diff --cached --exit-code -- pnpm-lock.yaml
      - run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @lingo/api test
      - name: Synchronize lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            pnpm install --lockfile-only
            if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "ci: update pnpm lockfile [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Verify lockfile is committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm audit --audit-level=high
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
