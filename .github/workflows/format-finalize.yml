name: format finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Format and verify
        run: |
          pnpm exec prettier --write \
            apps/api/src/tests/database-smoke.test.ts \
            apps/api/src/tests/pos-auth-contract.test.ts \
            apps/api/src/tests/pos-auth-policy.test.ts \
            apps/api/src/tests/pos-origin.test.ts \
            apps/api/src/tests/postgres-roles.test.ts \
            apps/api/src/tests/web-order-migration-static.test.ts \
            apps/api/src/tests/web-order-migration.test.ts \
            apps/api/src/ws.ts \
            apps/pos/lib/api.ts \
            apps/web/app/products/[slug]/page.tsx
          pnpm exec prettier --check \
            apps/api/src/tests/database-smoke.test.ts \
            apps/api/src/tests/pos-auth-contract.test.ts \
            apps/api/src/tests/pos-auth-policy.test.ts \
            apps/api/src/tests/pos-origin.test.ts \
            apps/api/src/tests/postgres-roles.test.ts \
            apps/api/src/tests/web-order-migration-static.test.ts \
            apps/api/src/tests/web-order-migration.test.ts \
            apps/api/src/ws.ts \
            apps/pos/lib/api.ts \
            apps/web/app/products/[slug]/page.tsx
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/tests/database-smoke.test.ts apps/api/src/tests/pos-auth-contract.test.ts apps/api/src/tests/pos-auth-policy.test.ts apps/api/src/tests/pos-origin.test.ts apps/api/src/tests/postgres-roles.test.ts apps/api/src/tests/web-order-migration-static.test.ts apps/api/src/tests/web-order-migration.test.ts apps/api/src/ws.ts apps/pos/lib/api.ts 'apps/web/app/products/[slug]/page.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format all changed source files [format-finalize]'
          git push origin main
