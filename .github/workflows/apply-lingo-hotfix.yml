name: Apply Lingo Store hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected text not found: {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          # PostgreSQL pg_advisory_xact_lock() returns void. Prisma $queryRaw tries to deserialize it.
          # Use $executeRaw for the lock statements because their result is intentionally ignored.
          replace_once(
              'apps/api/src/server.ts',
              '  await tx.$queryRaw`SELECT pg_advisory_xact_lock(49482011)`;',
              '  await tx.$executeRaw`SELECT pg_advisory_xact_lock(49482011)`;',
          )
          replace_once(
              'apps/api/src/server.ts',
              '        await tx.$queryRaw`SELECT pg_advisory_xact_lock(hashtextextended(${customerAccount.id + ":" + b.idempotencyKey}, 0))`;',
              '        await tx.$executeRaw`SELECT pg_advisory_xact_lock(hashtextextended(${customerAccount.id + ":" + b.idempotencyKey}, 0))`;',
          )

          # Uploaded product images must live in shared storage, not inside the Admin app tree.
          replace_once(
              'apps/admin/app/api/product-image/route.ts',
              'return process.env.PRODUCT_IMAGE_DIR || path.resolve(process.cwd(), "apps/web/public/uploads/products");',
              'return process.env.PRODUCT_IMAGE_DIR || path.resolve(process.cwd(), ".data/product-images");',
          )

          # The storefront serves the shared image directory through a controlled Next route.
          p = Path('apps/web/app/uploads/products/[filename]/route.ts')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text('''import { readFile } from "node:fs/promises";\nimport path from "node:path";\nimport { NextResponse } from "next/server";\n\nconst ROOT = process.env.PRODUCT_IMAGE_DIR || path.resolve(process.cwd(), ".data/product-images");\nconst TYPES: Record<string, string> = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" };\n\nexport async function GET(_request: Request, context: { params: Promise<{ filename: string }> }) {\n  const { filename } = await context.params;\n  if (!/^[a-f0-9-]+\\.(?:jpg|jpeg|png|webp)$/i.test(filename))\n    return NextResponse.json({ error: "NOT_FOUND" }, { status: 404 });\n  try {\n    const bytes = await readFile(path.join(ROOT, filename));\n    const ext = path.extname(filename).slice(1).toLowerCase();\n    return new NextResponse(bytes, {\n      headers: {\n        "content-type": TYPES[ext] || "application/octet-stream",\n        "cache-control": "public, max-age=31536000, immutable",\n        "x-content-type-options": "nosniff",\n      },\n    });\n  } catch {\n    return NextResponse.json({ error: "NOT_FOUND" }, { status: 404 });\n  }\n}\n''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts apps/admin/app/api/product-image/route.ts apps/web/app/uploads/products/[filename]/route.ts
          git commit -m "fix: repair web orders and product image delivery [hotfix-applied]"
          git push origin main

          rm .github/workflows/apply-lingo-hotfix.yml
          git add .github/workflows/apply-lingo-hotfix.yml
          git commit -m "chore: remove one-time hotfix workflow [hotfix-applied]"
          git push origin main
