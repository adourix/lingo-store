# Include inside nginx's http {} context for local TLS development.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=lingo_local_ip:10m rate=10r/s;

upstream lingo_local_web { server 127.0.0.1:3000; }
upstream lingo_local_admin { server 127.0.0.1:3001; }
upstream lingo_local_pos { server 127.0.0.1:3002; }
upstream lingo_local_api { server 127.0.0.1:4000; }

proxy_set_header X-Middleware-Subrequest "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $host;
client_max_body_size 1m;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

server {
  listen 443 ssl;
  server_name lingostore.localhost;
  ssl_certificate /etc/nginx/tls/lingo-localhost.pem;
  ssl_certificate_key /etc/nginx/tls/lingo-localhost-key.pem;
  include /etc/nginx/snippets/lingo-security-headers.conf;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  limit_req zone=lingo_local_ip burst=30 nodelay;
  location ^~ /api/public/ { proxy_pass http://lingo_local_api; }
  location ^~ /api/auth/ { proxy_pass http://lingo_local_api; }
  location ^~ /api/account/ { proxy_pass http://lingo_local_api; }
  location ^~ /api/admin/ { return 404; }
  location ^~ /api/pos/ { return 404; }
  location ^~ /ws/ { return 404; }
  location / { proxy_pass http://lingo_local_web; }
}

server {
  listen 443 ssl;
  server_name admin.localhost;
  ssl_certificate /etc/nginx/tls/lingo-localhost.pem;
  ssl_certificate_key /etc/nginx/tls/lingo-localhost-key.pem;
  include /etc/nginx/snippets/lingo-security-headers.conf;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  limit_req zone=lingo_local_ip burst=20 nodelay;
  location ^~ /api/admin/ { proxy_pass http://lingo_local_api; }
  location = /ws/admin {
    proxy_pass http://lingo_local_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location ^~ /api/public/ { return 404; }
  location ^~ /api/auth/ { return 404; }
  location ^~ /api/account/ { return 404; }
  location ^~ /api/pos/ { return 404; }
  location = /ws/pos { return 404; }
  location / { proxy_pass http://lingo_local_admin; }
}

server {
  listen 443 ssl;
  server_name pos.localhost;
  ssl_certificate /etc/nginx/tls/lingo-localhost.pem;
  ssl_certificate_key /etc/nginx/tls/lingo-localhost-key.pem;
  include /etc/nginx/snippets/lingo-security-headers.conf;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  limit_req zone=lingo_local_ip burst=30 nodelay;
  location ^~ /api/admin/ { return 404; }
  location ^~ /api/public/ { return 404; }
  location ^~ /api/auth/ { return 404; }
  location ^~ /api/account/ { return 404; }
  location ^~ /api/pos/ { proxy_pass http://lingo_local_api; }
  location = /ws/admin { return 404; }
  location = /ws/pos {
    proxy_pass http://lingo_local_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
  location / { proxy_pass http://lingo_local_pos; }
}

server {
  listen 80;
  server_name lingostore.localhost admin.localhost pos.localhost;
  return 301 https://$host$request_uri;
}
