# Authoritative host isolation for Lingo Store v2.
# Replace example hostnames and certificate paths before production.
upstream lingo_web { server 127.0.0.1:3000; }
upstream lingo_admin { server 127.0.0.1:3001; }
upstream lingo_pos { server 127.0.0.1:4173; }
upstream lingo_api { server 127.0.0.1:4000; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl http2; server_name lingostore.example;
  # ssl_certificate /etc/letsencrypt/live/lingostore.example/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/lingostore.example/privkey.pem;
  location /api/public/ { proxy_pass http://lingo_api; }
  location / { proxy_pass http://lingo_web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
server {
  listen 443 ssl http2; server_name admin.lingostore.example;
  # ssl_certificate /etc/letsencrypt/live/admin.lingostore.example/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/admin.lingostore.example/privkey.pem;
  location /api/admin/ { proxy_pass http://lingo_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://lingo_admin; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
server {
  listen 443 ssl http2; server_name pos.lingostore.example;
  # ssl_certificate /etc/letsencrypt/live/pos.lingostore.example/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/pos.lingostore.example/privkey.pem;
  location /api/pos/ { proxy_pass http://lingo_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /ws/ { proxy_pass http://lingo_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location / { proxy_pass http://lingo_pos; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
server { listen 80; server_name lingostore.example admin.lingostore.example pos.lingostore.example; return 301 https://$host$request_uri; }