map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=lingo_ip:10m rate=10r/s;
upstream lingo_web { server 127.0.0.1:3000; } upstream lingo_admin { server 127.0.0.1:3001; } upstream lingo_pos { server 127.0.0.1:4173; } upstream lingo_api { server 127.0.0.1:4000; }
proxy_set_header X-Middleware-Subrequest ""; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; proxy_set_header X-Original-URI $request_uri; proxy_hide_header Server;
client_max_body_size 1m; proxy_connect_timeout 5s; proxy_send_timeout 30s; proxy_read_timeout 30s;
add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; add_header X-Frame-Options DENY always; add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; add_header Cross-Origin-Opener-Policy same-origin always; add_header Cross-Origin-Resource-Policy same-origin always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
server { listen 443 ssl http2; server_name lingostore.example; limit_req zone=lingo_ip burst=30 nodelay; location ^~ /api/public/ { proxy_pass http://lingo_api; } location ^~ /api/auth/ { proxy_pass http://lingo_api; } location ^~ /api/account/ { proxy_pass http://lingo_api; } location ^~ /api/admin/ { return 404; } location ^~ /api/pos/ { return 404; } location ^~ /ws/ { return 404; } location / { proxy_pass http://lingo_web; } }
server { listen 443 ssl http2; server_name admin.lingostore.example; add_header X-Robots-Tag "noindex, nofollow" always; limit_req zone=lingo_ip burst=20 nodelay; location ^~ /api/admin/ { proxy_pass http://lingo_api; } location = /staff/setup { return 404; } location ~ ^/setup/([^/]+)$ { proxy_pass http://lingo_admin/staff/setup?token=$1; } location = /ws/admin { proxy_pass http://lingo_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; } location ^~ /api/public/ { return 404; } location ^~ /api/pos/ { return 404; } location / { proxy_pass http://lingo_admin; } }
server { listen 443 ssl http2; server_name pos.lingostore.example; add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(self), serial=(self)" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss://pos.lingostore.example; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always; limit_req zone=lingo_ip burst=30 nodelay; location ^~ /api/pos/ { proxy_pass http://lingo_api; } location = /ws/pos { proxy_pass http://lingo_api; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; } location ^~ /api/admin/ { return 404; } location ^~ /api/public/ { return 404; } location / { proxy_pass http://lingo_pos; add_header Cache-Control "no-cache" always; } location ~* \.(js|css|png|jpg|jpeg|svg|woff2)$ { proxy_pass http://lingo_pos; add_header Cache-Control "public,max-age=31536000,immutable" always; } }
server { listen 80; server_name lingostore.example admin.lingostore.example pos.lingostore.example; return 301 https://$host$request_uri; }